name: Code Quality

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 black mypy bandit

      - name: Run Black formatter check
        run: |
          black --check ai_gateway.py rtx_agent.py tests/

      - name: Run Flake8
        run: |
          flake8 ai_gateway.py rtx_agent.py tests/

      - name: Run Pylint on ai_gateway.py
        run: |
          pylint ai_gateway.py --fail-under=7.0

      - name: Run Pylint on rtx_agent.py
        run: |
          pylint rtx_agent.py --fail-under=7.0

      - name: Run Mypy type checker
        continue-on-error: true
        run: |
          mypy ai_gateway.py rtx_agent.py --ignore-missing-imports

      - name: Run Bandit security scan
        continue-on-error: true
        run: |
          bandit -r ai_gateway.py rtx_agent.py -f json -o bandit-report.json

      - name: Display summary
        if: always()
        run: |
          echo "✅ Code quality checks complete"
          echo "See job logs for details"
