name: CI - Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install test dependencies
      run: |
        pip install pytest pytest-cov pytest-mock

    - name: Run tests with coverage
      run: |
        pytest tests/ -v --cov=ai_gateway --cov=rtx_agent --cov-report=xml --cov-report=term-missing

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: matrix.os == 'ubuntu-latest'
      with:
        name: coverage-report
        path: coverage.xml

    - name: Generate coverage badge
      if: matrix.os == 'ubuntu-latest'
      run: |
        coverage_percent=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(root.attrib['line-rate'])")
        echo "COVERAGE=${coverage_percent}" >> $GITHUB_ENV
        echo "Coverage: ${coverage_percent}%"

    - name: Create coverage badge
      if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main'
      uses: schneegans/dynamic-badges-action@v1.7.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: your-gist-id-here
        filename: claudeagent-coverage.json
        label: Coverage
        message: ${{ env.COVERAGE }}%
        color: brightgreen
