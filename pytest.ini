[pytest]
# Pytest configuration for ClaudeAgent

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts =
    -v
    --strict-markers
    --cov=ai_gateway
    --cov=rtx_agent
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=40

# Coverage
[coverage:run]
source = ai_gateway,rtx_agent
omit =
    tests/*
    */site-packages/*
    setup.py
    autonomous/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
